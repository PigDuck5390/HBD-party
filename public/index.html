<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2b1d3a">
  <title>생일 파티 🎂</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 게임 HUD -->
  <div id="hud" hidden>
    <div class="title-card">
      <div class="title">🎂 <span class="bd-name"></span>의 생일 파티</div>
      <div class="online">👥 <span id="online">0</span>명 함께하는 중</div>
    </div>
    <div id="chatLog" aria-live="polite"></div>

    <div class="actions">
      <button id="btnChat" class="act" type="button" aria-label="채팅"><span>💬</span><small>채팅</small></button>
      <button id="btnFirework" class="act" type="button" aria-label="폭죽"><span>🎆</span><small>폭죽</small></button>
      <button id="btnGuestbook" class="act" type="button" aria-label="방명록"><span>📜</span><small>방명록</small><i class="badge" hidden></i></button>
      <button id="btnGift" class="act" type="button" aria-label="선물 놓기"><span>🎁</span><small>선물</small></button>
      <input id="giftFile" type="file" accept="image/*" hidden>
      <button id="btnSound" class="act small" type="button" aria-label="소리"><span>🔊</span></button>
    </div>

    <div id="dpad" aria-label="방향키">
      <div class="dir up">▲</div>
      <div class="dir down">▼</div>
      <div class="dir left">◀</div>
      <div class="dir right">▶</div>
      <div class="hub"></div>
    </div>

    <form id="chatBar" hidden autocomplete="off">
      <input id="chatInput" maxlength="60" placeholder="말풍선으로 보낼 메시지…" enterkeyhint="send">
      <button type="submit">전송</button>
      <button type="button" id="chatClose" class="ghost" aria-label="닫기">✕</button>
    </form>
  </div>

  <div id="toasts"></div>

  <!-- 참가 화면 -->
  <div id="join">
    <form id="joinForm" class="card" autocomplete="off">
      <div class="confetti-top">🎉 🎈 🎂 🎈 🎉</div>
      <h1><span class="bd-name"></span>의<br>생일 파티에 초대합니다!</h1>
      <div class="preview-wrap">
        <canvas id="preview" width="160" height="150"></canvas>
        <button type="button" id="reroll" class="pill">🎲 다른 색</button>
      </div>
      <input id="nameInput" maxlength="12" placeholder="내 이름 (최대 12자)" required>
      <button id="joinBtn" class="primary" type="submit" disabled>참가하기</button>
      <p id="joinStatus" class="status">서버에 연결하는 중…</p>
    </form>
  </div>

  <!-- 방명록 -->
  <div id="gbModal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-labelledby="gbTitle">
      <header>
        <h2 id="gbTitle">📜 축하 방명록 <small id="gbTotal"></small></h2>
        <button type="button" id="gbClose" class="ghost" aria-label="닫기">✕</button>
      </header>
      <form id="gbForm" autocomplete="off">
        <textarea id="gbText" maxlength="300" rows="3" placeholder="생일 축하 메시지를 남겨주세요 💌"></textarea>
        <div class="row">
          <span id="gbCount">0 / 300</span>
          <button type="submit" class="primary small">남기기</button>
        </div>
      </form>
      <ul id="gbList"></ul>
    </div>
  </div>

  <!-- 선물 열어보기 -->
  <div id="giftModal" class="modal gift-modal" hidden>
    <div class="gift-card" role="dialog" aria-labelledby="giftTitle">
      <button type="button" id="giftClose" class="ghost gift-close" aria-label="닫기">✕</button>
      <div class="gift-ribbon">🎁</div>
      <h2 id="giftTitle"></h2>
      <div class="gift-photo"><img id="giftImg" alt="선물 사진"></div>
      <time id="giftTime"></time>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="world.js"></script>
  <script src="game.js"></script>
</body>
</html>
